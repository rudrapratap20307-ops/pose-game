<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spell ACE</title>
<style>
:root{--sea:#0f3b4c;--deep:#0a2733;--chalk:#e9f1ee;--brass:#e0a526;--ok:#7fd49a;--bad:#ff8a7a}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--sea);color:var(--chalk);font:17px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:24px 20px 48px}
main{max-width:480px;margin:0 auto}
.glyph{font:800 9rem/0.9 Georgia,serif;color:transparent;-webkit-text-stroke:3px var(--brass);margin:0 0 8px}
h1{font-size:1.5rem;margin:0 0 6px}
p{margin:0 0 14px}
button{width:100%;padding:16px;font:700 1.05rem system-ui,sans-serif;background:var(--brass);color:var(--deep);border:0;border-radius:8px}
button:disabled{opacity:.45}
button:focus-visible{outline:3px solid var(--chalk);outline-offset:3px}
.chips{display:flex;gap:10px;margin:16px 0}
.chips button{flex:1;padding:12px;font-size:1.3rem;background:transparent;color:var(--chalk);border:2px solid var(--chalk)}
.chips button.on{border-color:var(--brass);color:var(--brass)}
.chips button.done{background:var(--ok);color:var(--deep);border-color:var(--ok)}
.ref{margin:0 0 18px;display:flex;gap:14px;align-items:center}
.ref img{height:130px;max-width:50%;object-fit:contain;background:#fff;border-radius:6px}
.ref figcaption{font-size:.95rem}
input{display:none}
canvas{display:none;width:100%;margin-top:18px;border-radius:8px}
#out{display:none;margin-top:18px;padding:16px;border-radius:8px;background:var(--deep)}
#out.ok{border:2px solid var(--ok)}
#out.bad{border:2px solid var(--bad)}
#clue{font-size:1.3rem;font-weight:700;margin:8px 0 0}
ul{margin:8px 0 0;padding-left:20px}
pre{white-space:pre-wrap;font-size:.8rem;opacity:.8}
</style>
</head>
<body>
<main>
  <div class="glyph" id="glyph" aria-hidden="true">A</div>
  <h1>Spell ACE with your team</h1>
  <p>Use as many people as you like. Take one photo per letter, from the side, with every full body in the frame and a plain background behind you.</p>
  <div class="chips" id="chips"></div>
  <figure class="ref" id="refbox"><img id="ref" alt="Example of people forming the letter"><figcaption>Make a shape like this one.</figcaption></figure>
  <button id="go" disabled>Loading checker…</button>
  <input id="file" type="file" accept="image/*">
  <canvas id="cv"></canvas>
  <div id="out" role="status" aria-live="polite"></div>
</main>

<script type="module">
import {ImageSegmenter, FilesetResolver} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/+esm";

/* ---- SETTINGS ---------------------------------------------------------
   clueB64:  the final clue, base64-encoded so it is not readable in the page source.
             btoa(String.fromCharCode(...new TextEncoder().encode("your clue")))
   minScore: how closely the group’s outline must match the letter (0 to 1). Lower = more forgiving.
   topK:     the target letter must rank in the top K of all 26 letters.
   Add ?debug=1 to the page link to see the scores.
   Reference photos: ref-A.png, ref-C.png, ref-E.png next to this file.
------------------------------------------------------------------------- */
const CONFIG = {letters: ["A", "C", "E"], minScore: 0.45, topK: 2, clueB64: "WW91ciBjbHVlIGdvZXMgaGVyZS4gUmVwbGFjZSB0aGlzIHRleHQgYmVmb3JlIHRoZSBldmVudC4="};
const GW = 32, GH = 40, PERSON = 15;

const $ = id => document.getElementById(id);
const debug = new URLSearchParams(location.search).has("debug");
const store = {
  get() { try { return JSON.parse(localStorage.getItem("ace-done") || "[]"); } catch { return []; } },
  set(v) { try { localStorage.setItem("ace-done", JSON.stringify(v)); } catch {} }
};
let seg, templates, done = store.get(), cur = CONFIG.letters.find(l => !done.includes(l)) || CONFIG.letters[0];

/* Turn a black/white mask into a small, blurred grid, cropped to the shape's bounding box. */
function toGrid(bin, w, h) {
  const cols = new Uint32Array(w), rows = new Uint32Array(h);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) if (bin[y * w + x]) { cols[x]++; rows[y]++; }
  const first = a => a.findIndex(v => v > 1);
  const last = a => { for (let i = a.length - 1; i >= 0; i--) if (a[i] > 1) return i; return -1; };
  const x0 = first(cols), x1 = last(cols), y0 = first(rows), y1 = last(rows);
  if (x0 < 0 || y0 < 0 || x1 <= x0 || y1 <= y0) return null;
  const bw = x1 - x0 + 1, bh = y1 - y0 + 1, g = new Float32Array(GW * GH);
  for (let gy = 0; gy < GH; gy++) {
    const ya = y0 + Math.floor(gy * bh / GH), yb = Math.max(ya + 1, y0 + Math.floor((gy + 1) * bh / GH));
    for (let gx = 0; gx < GW; gx++) {
      const xa = x0 + Math.floor(gx * bw / GW), xb = Math.max(xa + 1, x0 + Math.floor((gx + 1) * bw / GW));
      let s = 0, c = 0;
      for (let y = ya; y < yb; y++) for (let x = xa; x < xb; x++) { s += bin[y * w + x]; c++; }
      g[gy * GW + gx] = s / c;
    }
  }
  return blur(blur(g));
}
function blur(g) {
  const o = new Float32Array(g.length);
  for (let y = 0; y < GH; y++) for (let x = 0; x < GW; x++) {
    let s = 0, c = 0;
    for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
      const xx = x + dx, yy = y + dy;
      if (xx >= 0 && xx < GW && yy >= 0 && yy < GH) { s += g[yy * GW + xx]; c++; }
    }
    o[y * GW + x] = s / c;
  }
  return o;
}
function corr(a, b) {
  let ma = 0, mb = 0;
  for (let i = 0; i < a.length; i++) { ma += a[i]; mb += b[i]; }
  ma /= a.length; mb /= a.length;
  let n = 0, da = 0, db = 0;
  for (let i = 0; i < a.length; i++) { const x = a[i] - ma, y = b[i] - mb; n += x * y; da += x * x; db += y * y; }
  return n / Math.sqrt(da * db || 1);
}

/* Bold letters A to Z, drawn once and reduced to the same kind of grid. */
function makeTemplates() {
  const T = {}, W = 260, H = 260, c = document.createElement("canvas");
  c.width = W; c.height = H;
  const x = c.getContext("2d", {willReadFrequently: true});
  for (const ch of "ABCDEFGHIJKLMNOPQRSTUVWXYZ") {
    x.fillStyle = "#000"; x.fillRect(0, 0, W, H);
    x.fillStyle = x.strokeStyle = "#fff"; x.lineWidth = 16; x.lineJoin = "round";
    x.font = "bold 200px Arial,Helvetica,sans-serif"; x.textAlign = "center"; x.textBaseline = "middle";
    x.fillText(ch, W / 2, H / 2); x.strokeText(ch, W / 2, H / 2);
    const d = x.getImageData(0, 0, W, H).data, bin = new Uint8Array(W * H);
    for (let i = 0; i < bin.length; i++) bin[i] = d[i * 4] > 128 ? 1 : 0;
    T[ch] = toGrid(bin, W, H);
  }
  return T;
}

async function init() {
  const files = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
  seg = await ImageSegmenter.createFromOptions(files, {
    baseOptions: {modelAssetPath: "https://storage.googleapis.com/mediapipe-models/image_segmenter/deeplab_v3/float32/1/deeplab_v3.tflite"},
    runningMode: "IMAGE", outputCategoryMask: true, outputConfidenceMasks: false
  });
  templates = makeTemplates();
  $("go").disabled = false;
  render();
}

function render() {
  $("glyph").textContent = cur;
  $("chips").innerHTML = CONFIG.letters.map(l =>
    `<button data-l="${l}" class="${l === cur ? "on" : ""} ${done.includes(l) ? "done" : ""}" aria-label="Letter ${l}${done.includes(l) ? ", done" : ""}">${l}</button>`).join("");
  document.querySelectorAll("#chips button").forEach(b => b.onclick = () => { cur = b.dataset.l; render(); });
  const img = $("ref"); $("refbox").style.display = "flex"; img.src = `ref-${cur}.png`;
  img.onerror = () => { $("refbox").style.display = "none"; };
  $("go").textContent = `Take or upload your photo of ${cur}`;
}

function silhouette(cv) {
  const r = seg.segment(cv), m = r.categoryMask;
  const arr = m.getAsUint8Array(), w = m.width, h = m.height, bin = new Uint8Array(w * h);
  for (let i = 0; i < bin.length; i++) bin[i] = arr[i] === PERSON ? 1 : 0;
  m.close(); r.close?.();
  return {bin, w, h};
}
function reveal() {
  return new TextDecoder().decode(Uint8Array.from(atob(CONFIG.clueB64), c => c.charCodeAt(0)));
}

$("go").onclick = () => $("file").click();
$("file").onchange = async e => {
  const f = e.target.files[0];
  if (!f) return;
  const go = $("go"), out = $("out"), cv = $("cv"), ctx = cv.getContext("2d");
  go.disabled = true; go.textContent = "Checking your shape…";
  try {
    const bmp = await createImageBitmap(f, {imageOrientation: "from-image"});
    const s = Math.min(1, 1024 / Math.max(bmp.width, bmp.height));
    cv.width = Math.round(bmp.width * s); cv.height = Math.round(bmp.height * s);
    ctx.drawImage(bmp, 0, 0, cv.width, cv.height);
    const {bin, w, h} = silhouette(cv);
    const t = document.createElement("canvas"); t.width = w; t.height = h;
    const tc = t.getContext("2d"), id = tc.createImageData(w, h);
    for (let i = 0; i < bin.length; i++) if (bin[i]) { id.data[i * 4] = 224; id.data[i * 4 + 1] = 165; id.data[i * 4 + 2] = 38; id.data[i * 4 + 3] = 170; }
    tc.putImageData(id, 0, 0); ctx.drawImage(t, 0, 0, cv.width, cv.height);
    cv.style.display = "block";

    const grid = toGrid(bin, w, h);
    let html, cls;
    if (!grid) {
      cls = "bad"; html = "<strong>We couldn’t see anyone in that photo.</strong><p>Step back so everyone’s full body is in the frame, with a plain background.</p>";
    } else {
      const scores = Object.entries(templates).map(([ch, g]) => [ch, corr(grid, g)]).sort((a, b) => b[1] - a[1]);
      const rank = scores.findIndex(q => q[0] === cur), sc = scores[rank][1];
      const log = debug ? "<pre>" + scores.slice(0, 5).map(q => q[0] + " " + q[1].toFixed(2)).join("\n") + `\ntarget ${cur}: ${sc.toFixed(2)} (rank ${rank + 1})</pre>` : "";
      if (sc >= CONFIG.minScore && rank < CONFIG.topK) {
        cls = "ok";
        if (!done.includes(cur)) { done.push(cur); store.set(done); }
        const left = CONFIG.letters.filter(l => !done.includes(l));
        if (!left.length) {
          html = `<strong>A, C, E. You spelled it. Here is your clue:</strong><p id="clue"></p>${log}`;
        } else {
          cur = left[0];
          html = `<strong>That’s a clean letter. Next up: ${cur}.</strong>${log}`;
        }
      } else {
        cls = "bad";
        html = `<strong>Not quite ${cur} yet. Try again:</strong><ul><li>Make the whole group one connected shape.</li><li>Shoot from the side, and keep every body fully in frame.</li><li>Use a plain background and stand clear of other people.</li></ul>${log}`;
      }
    }
    out.className = cls; out.innerHTML = html; out.style.display = "block";
    if ($("clue")) $("clue").textContent = reveal();
  } catch (err) {
    out.className = "bad"; out.style.display = "block";
    out.innerHTML = "<strong>Something went wrong reading that photo.</strong><p>Try taking it again.</p>";
  }
  go.disabled = false; render();
  e.target.value = "";
};

init().catch(() => { $("go").textContent = "Couldn’t load. Check your connection and refresh."; });
</script>
</body>
</html>
